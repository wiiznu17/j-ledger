server:
  port: 8081

spring:
  application:
    name: finance-service

  kafka:
    bootstrap-servers: ${JLEDGER_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

  datasource:
    primary:
      url: ${JLEDGER_DATASOURCE_URL}
      username: ${JLEDGER_DATASOURCE_USERNAME}
      password: ${JLEDGER_DATASOURCE_PASSWORD}
      driver-class-name: org.postgresql.Driver
    replica:
      url: ${JLEDGER_DATASOURCE_READ_URL:${JLEDGER_DATASOURCE_URL}}
      username: ${JLEDGER_DATASOURCE_USERNAME}
      password: ${JLEDGER_DATASOURCE_PASSWORD}
      driver-class-name: org.postgresql.Driver

  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD}

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: finance
        dialect: org.hibernate.dialect.PostgreSQLDialect
 
  flyway:
    enabled: false
    locations: classpath:db/migration
    schemas: finance
    baseline-on-migrate: false

jledger:
  internal:
    secret: ${JLEDGER_INTERNAL_SECRET}
  limits:
    daily: 1000000
    per-transaction: 500000
    monthly: 5000000
  system:
    account-id: "00000000-0000-0000-0000-000000000000"

  redis:
    redisson:
      config: classpath:redisson-config.yaml

  kafka:
    bootstrap-servers: ${JLEDGER_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: finance-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.jledger.finance: DEBUG
    org.springframework: INFO
